// Template parser for JSON events sent via HEC. Uses gron to capture the event
// under unmapped.*, then maps fields in one mappings block.
//
// Comments must be // or /* */ comments. A "_comment" key inside a
// transformations entry is rejected on deploy ("Expected one entry in object
// in 'transformations' array").
{
  "attributes": {
    "dataSource.category": "security",
    "dataSource.name": "PRODUCT_NAME",
    "dataSource.vendor": "VENDOR_NAME",
    "metadata.product.name": "PRODUCT_NAME",
    "metadata.product.vendor_name": "VENDOR_NAME",
    "metadata.version": "1.0.0"
  },
  "formats": [
    {
      "format": "$unmapped.{parse=gron}$",
      "rewrites": [
        {
          "input": "unmapped.timestamp",
          "output": "timestamp",
          "match": ".*",
          "replace": "$0"
        }
      ]
    }
  ],
  "mappings": {
    "version": 1,
    "mappings": [
      {
        "predicate": "true",
        "transformations": [
          // Map OCSF class fields
          {
            "constant": {
              "value": 3002,
              "field": "class_uid"
            }
          },
          {
            "constant": {
              "value": "Authentication",
              "field": "class_name"
            }
          },
          {
            "constant": {
              "value": 3,
              "field": "category_uid"
            }
          },
          {
            "constant": {
              "value": "Identity & Access Management",
              "field": "category_name"
            }
          },
          // Handle timestamp conversion
          {
            "copy": {
              "from": "unmapped.timestamp",
              "to": "time"
            }
          },
          {
            "cast": {
              "field": "time",
              "type": "iso8601TimestampToEpochSec"
            }
          },
          // A source key that contains dots ("field.with.dots") is captured as
          // one flat field. Reference it with plain dots; escaped dots do not match.
          {
            "rename": {
              "from": "unmapped.field.with.dots",
              "to": "target_field"
            }
          },
          // Example mappings for common fields
          {
            "rename": {
              "from": "unmapped.source.ip",
              "to": "src_endpoint.ip"
            }
          },
          {
            "rename": {
              "from": "unmapped.user",
              "to": "user.name"
            }
          },
          {
            "rename": {
              "from": "unmapped.status",
              "to": "status"
            }
          },
          {
            "rename": {
              "from": "unmapped.message",
              "to": "message"
            }
          },
          // Conditional mappings based on field values
          {
            "constant": {
              "value": 1,
              "field": "severity_id",
              "predicate": "status = 'SUCCESS'"
            }
          },
          {
            "constant": {
              "value": 3,
              "field": "severity_id",
              "predicate": "status = 'FAILURE'"
            }
          }
        ]
      }
    ]
  }
}
