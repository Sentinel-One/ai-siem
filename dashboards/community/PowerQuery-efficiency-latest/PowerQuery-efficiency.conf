{
  "duration": "24h",
  "description": "PowerQuery efficiency monitor. Scopes All Data down to the SDL query-audit trail (tag='queryOutcome') and reports execution time, CPU, bytes scanned, selectivity and errors for one PowerQuery, selected by the pq_id parameter.",

  "parameters": [
    {
      "name": "pq_id",
      "label": "PowerQuery ID (lrqToken) or text marker",
      "defaultValue": ""
    },
    {
      "name": "purpose",
      "label": "Query origin (queryPurpose)",
      "facet": "queryPurpose",
      "defaultValue": ""
    }
  ],

  "graphs": [
    {
      "title": " ",
      "graphStyle": "markdown",
      "markdown": "### PowerQuery efficiency\n\nEvery panel reads the data lake's own query-audit trail: **`tag='queryOutcome'`** inside *All Data*. One PowerQuery execution emits **one event per internal stage**, all sharing the same **`lrqToken`** — so panels that talk about *an execution* group by `lrqToken`, and the **Stage detail** panel shows the individual stages.\n\n**Identifying a query — the `pq_id` box accepts either form:**\n\n| You type | It matches | Use it for |\n|---|---|---|\n| `94136d52-9382-4c0b-…` | `lrqToken` exactly | one specific execution you are debugging |\n| `pqid:CHECKOUT_LATENCY` | substring of the query text | the *same* query across every run |\n\nThere is no tenant-wide stable ID for a saved PowerQuery, so for run-over-run tracking append a marker comment to the query you want to watch — `… | limit 100 //pqid:CHECKOUT_LATENCY`. Comments are stored verbatim in the audited `filter` field, so the marker is searchable. Leave `pq_id` empty to see all queries.\n\n**Reading the numbers:** `elapsedTimeMs` is wall time, `cpuUsageMs` is compute burned, `coverBytes` is bytes scanned. **Bytes per matched event** is the selectivity signal — a high value means the query read a lot to return little, which is the usual inefficiency. `timeSpanMins` is how wide a window the query asked for.\n\n**Coverage caveat:** `coverBytes` and `cpuUsageMs` are only populated for search-backed origins (`Search Query`, `Search Query Power Query`, `v2_api_queries/pq`, `Graph`). Console PowerQuery-explorer stages (`queryPurpose = 'Power Query'`) report **0** for both — that is the platform, not a broken panel. Use the **Origin** filter to compare like with like.",
      "layout": { "h": 15, "w": 60, "x": 0, "y": 0 }
    },

    {
      "title": "Executions",
      "graphStyle": "number",
      "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose contains '#purpose#'\n| group v=estimate_distinct(lrqToken)\n| columns v\n| limit 1",
      "options": { "format": "auto", "precision": "0" },
      "layout": { "h": 9, "w": 12, "x": 0, "y": 15 }
    },
    {
      "title": "p95 execution time",
      "graphStyle": "number",
      "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose contains '#purpose#'\n| group v=p95(elapsedTimeMs)\n| columns v\n| limit 1",
      "options": { "format": "auto", "precision": "0", "suffix": " ms" },
      "sparklineConfig": { "enabled": true },
      "layout": { "h": 9, "w": 12, "x": 12, "y": 15 }
    },
    {
      "title": "Error rate",
      "graphStyle": "number",
      "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose contains '#purpose#'\n| group errs=count(outcome=='ERROR'), n=count()\n| let v = n>0 ? errs*100.0/n : 0\n| columns v\n| limit 1",
      "options": { "format": "auto", "precision": "2", "suffix": "%", "color": "#d03b3b" },
      "layout": { "h": 9, "w": 12, "x": 24, "y": 15 }
    },
    {
      "title": "Bytes scanned",
      "graphStyle": "number",
      "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose contains '#purpose#'\n| group v=sum(coverBytes)\n| columns v\n| limit 1",
      "options": { "format": "bytes", "precision": "1" },
      "layout": { "h": 9, "w": 12, "x": 36, "y": 15 }
    },
    {
      "title": "Bytes per matched event",
      "graphStyle": "number",
      "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose contains '#purpose#'\n| group b=sum(coverBytes), m=sum(matchCount)\n| let v = m>0 ? b/m : b\n| columns v\n| limit 1",
      "options": { "format": "bytes", "precision": "1" },
      "layout": { "h": 9, "w": 12, "x": 48, "y": 15 }
    },

    {
      "title": "Execution time over time (ms)",
      "graphStyle": "line",
      "lineSmoothing": "straightLines",
      "yScale": "linear",
      "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose contains '#purpose#'\n| group p50_ms=p50(elapsedTimeMs), p95_ms=p95(elapsedTimeMs), max_ms=max(elapsedTimeMs) by timestamp=timebucket()\n| sort +timestamp",
      "layout": { "h": 18, "w": 30, "x": 0, "y": 24 }
    },
    {
      "title": "Bytes scanned over time",
      "graphStyle": "line",
      "lineSmoothing": "straightLines",
      "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose contains '#purpose#'\n| group bytes_scanned=sum(coverBytes) by timestamp=timebucket()\n| sort +timestamp",
      "layout": { "h": 18, "w": 30, "x": 30, "y": 24 }
    },

    {
      "title": "Executions — one row per lrqToken, slowest first",
      "graphStyle": "table",
      "showBarsColumn": "true",
      "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose contains '#purpose#'\n| group timestamp=max(timestamp), origin=newest(queryPurpose), user=newest(userEmail), stages=count(), elapsed_ms=sum(elapsedTimeMs), cpu_ms=sum(cpuUsageMs), bytes=sum(coverBytes), matched=sum(matchCount), errors=count(outcome=='ERROR'), window_mins=newest(timeSpanMins), q=newest(filter) by lrqToken\n| let bytes_per_match = matched>0 ? bytes/matched : bytes\n| sort -elapsed_ms\n| columns timestamp, lrqToken, origin, user, stages, elapsed_ms, cpu_ms, bytes, matched, bytes_per_match, window_mins, errors, q\n| limit 100",
      "layout": { "h": 22, "w": 60, "x": 0, "y": 42 }
    },

    {
      "title": "Errors",
      "graphStyle": "table",
      "query": "tag='queryOutcome' outcome=='ERROR' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose contains '#purpose#'\n| columns timestamp, lrqToken, queryPurpose, userEmail, elapsedTimeMs, timeSpanMins, filter\n| sort -timestamp\n| limit 50",
      "layout": { "h": 18, "w": 30, "x": 0, "y": 64 }
    },
    {
      "title": "Bytes scanned by origin",
      "graphStyle": "column",
      "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose contains '#purpose#'\n| group bytes_scanned=sum(coverBytes) by queryPurpose\n| sort -bytes_scanned",
      "layout": { "h": 18, "w": 30, "x": 30, "y": 64 }
    },

    {
      "title": "Worst selectivity — read a lot, returned little",
      "graphStyle": "table",
      "showBarsColumn": "true",
      "query": "tag='queryOutcome' coverBytes>0 (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose contains '#purpose#'\n| group bytes=sum(coverBytes), matched=sum(matchCount), elapsed_ms=sum(elapsedTimeMs), window_mins=newest(timeSpanMins), q=newest(filter) by lrqToken\n| let bytes_per_match = matched>0 ? bytes/matched : bytes\n| sort -bytes_per_match\n| columns lrqToken, bytes, matched, bytes_per_match, elapsed_ms, window_mins, q\n| limit 25",
      "layout": { "h": 18, "w": 30, "x": 0, "y": 82 }
    },
    {
      "title": "Stage detail — every audited stage of the selected execution",
      "graphStyle": "table",
      "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose contains '#purpose#'\n| columns timestamp, lrqToken, queryPurpose, elapsedTimeMs, cpuUsageMs, coverBytes, matchCount, outcome, timeSpanMins, filter\n| sort -timestamp\n| limit 200",
      "layout": { "h": 18, "w": 30, "x": 30, "y": 82 }
    }
  ],

  "options": { "layout": { "locked": 0 } }
}
