  "description": "Template v3.4: PHP2Shell (CVE-2026-109618 / CVE-2026-109619) exposure, post-exploitation hunting, and behavioral rarity analysis from EDR telemetry. Default view is 24h; the tiles say where 7 days is the better window.",
  "tabs": [
    {
      "tabName": "Exposure",
      "graphs": [
        {
          "title": "How to use this tab",
          "graphStyle": "markdown",
          "markdown": "Answers three questions from EDR telemetry: **which PHP is actually running**, **which web/PHP hosts take connections from the internet**, and **which web servers are reporting telemetry at all**. Hosts in both of the first two tables are the first to patch (PHP 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35) and restart workers. PHP 8.1 and older has no official fix; the **too old to patch** panel flags those installs by path. If one also shows internet inbound, take it off the internet until upgraded. All times are UTC.\n\n**Full command lines:** tables here deliberately leave out command lines (they truncate in reports, and a single sample can mislead). To see them, open the panel's query in Event Search and delete everything from the first `| group` onward; that returns the raw events behind the results, with the complete `src.process.cmdline` and `tgt.process.cmdline`. For panels that start with `| join`, use the filter line inside the first `( ... )` instead. Add `endpoint.name = '<host>'` to narrow to one row.",
          "layout": {
            "x": 0,
            "y": 0,
            "w": 60,
            "h": 7
          }
        },
        {
          "title": "Hosts with active PHP processes",
          "graphStyle": "number",
          "query": "src.process.name matches '^(php[0-9.]*|php-fpm[0-9.]*|php-cgi[0-9.]*|lsphp[0-9.]*|frankenphp|php\\\\.exe|php-cgi\\\\.exe|php-win\\\\.exe)$' | group n = count() by endpoint.name | group hosts = count() | limit 1",
          "options": {
            "format": "auto",
            "precision": "0"
