          "title": "Use 7 days for this table",
          "graphStyle": "markdown",
          "markdown": "**Switch to 7 days** for this one. PHP that runs from cron, scheduled tasks, or a quiet vendor app may not do anything in a 24-hour window.\n\n**Finding the branch:** the image path often names it (`ea-php82`, `php8.3-fpm`, `php83`). Confirm the exact patch level on the host; EDR doesn't record the PHP version.\n\n**mod_php gotcha:** with Apache mod_php, PHP runs inside the Apache process and shows as httpd/apache2, not php. Those hosts appear in the internet-exposure table below.",
