{
  // specify a time zone if the timestamps in your log are not in GMT
  // timezone: "GMT-0800"
  attributes: {
    "dataSource.name": "NGINX KV Log",
    "dataSource.category": "security",
    "dataSource.vendor": "NGINX",
  }


  formats: [
    {
      format: ".*time_local=\"$timestamp$\"" //not needed if you can change KV to use `timestamp` as key for time
    },
    {
      format:
    ".*$_=identifier$=$_=quotable$", repeat: true
    }
  ]
}