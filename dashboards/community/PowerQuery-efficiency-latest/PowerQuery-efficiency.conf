{
  "configType": "TABBED",
  "duration": "24h",
  "description": "PowerQuery efficiency monitor. Scopes All Data down to the SDL query-audit trail (tag='queryOutcome') across three tabs: Overview, Query Anatomy & Optimization, and Troubleshooting & Errors.",

  "tabs": [
    {
      "tabName": "About",
      "graphs": [
        {
          "title": "PowerQuery efficiency — how to read this dashboard",
          "graphStyle": "markdown",
          "markdown": "Every panel on every tab reads the data lake's own query-audit trail: **`tag='queryOutcome'`** inside *All Data*. One PowerQuery execution emits **one event per internal stage**, all sharing the same **`lrqToken`** — panels that talk about *an execution* group by `lrqToken`; **Stage detail** (Troubleshooting tab) shows the individual stages.\n\n### Finding a query — the `pq_id` box\n\n| You type | It matches | Use it for |\n|---|---|---|\n| `94136d52-9382-4c0b-…` | `lrqToken` exactly | one specific execution you are debugging |\n| `pqid:CHECKOUT_LATENCY` | substring of the query text | the *same* query across every run |\n\nThere is no tenant-wide stable ID for a saved PowerQuery, so for run-over-run tracking append a marker comment to the query you want to watch — `… | limit 100 //pqid:CHECKOUT_LATENCY`. Comments are stored verbatim in the audited `filter` field, so the marker is searchable. Leave `pq_id` empty to see all queries. `pq_id` and `purpose` are set independently on each of the other three tabs (dashboard parameters are tab-scoped in this product).\n\n### Narrowing by origin — the `purpose` box\n\n`purpose` filters to one `queryPurpose` value (console explorer, v2 API, Graph, etc). Leave it at **`*`** (the default) to see every origin. **Gotcha:** changing the dropdown does not auto-refresh the panels — pick a value, then press **Search**.\n\n### What each tab shows\n\n- **Overview**: five headline numbers — executions, p95 execution time, error rate (as a gauge), bytes scanned, and bytes per matched event — plus how execution time and bytes scanned have trended over the window.\n- **Query Anatomy & Optimization**: what the matched queries are actually *made of* — a donut of which constructs they use (grouping, sorting, limiting, exclusions, transforms, joins/reshapes), a donut of how many fall into a good/fair/poor selectivity tier, a breakdown of bytes scanned by origin, a heatmap of *when* and *which origin* scans the most data, and a ranked table of the worst-selectivity executions.\n- **Troubleshooting & Errors**: the full per-execution table (slowest first), a dedicated errors table, and the raw stage-by-stage detail for whatever `pq_id` you've selected.\n\n### Reading the numbers\n\n`elapsedTimeMs` is wall time, `cpuUsageMs` is compute burned, `coverBytes` is bytes scanned. **Bytes per matched event** is the selectivity signal — a high value means the query read a lot to return little, which is the usual inefficiency. `timeSpanMins` is how wide a window the query asked for. The **selectivity tiers** on the Anatomy tab use illustrative thresholds (<1KB/event = Good, <100KB/event = Fair, otherwise Poor) — adjust them to your own data volumes if they don't fit your tenant.\n\n### Coverage caveat\n\n`coverBytes` and `cpuUsageMs` are only populated for search-backed origins (`Search Query`, `Search Query Power Query`, `v2_api_queries/pq`, `Graph`). Console PowerQuery-explorer stages (`queryPurpose = 'Power Query'`) report **0** for both — that is the platform, not a broken panel. Use the **purpose** filter to compare like with like.",
          "layout": { "x": 0, "y": 0, "w": 60, "h": 40 }
        }
      ]
    },

    {
      "tabName": "Overview",
      "parameters": [
        {
          "name": "pq_id",
          "label": "PowerQuery ID (lrqToken) or text marker",
          "defaultValue": ""
        },
        {
          "name": "purpose",
          "label": "Query origin (queryPurpose)",
          "facet": "queryPurpose",
          "defaultValue": "*"
        }
      ],
      "graphs": [
        {
          "title": "Executions",
          "graphStyle": "number",
          "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| group v=estimate_distinct(lrqToken)\n| columns v\n| limit 1",
          "options": { "format": "auto", "precision": "0" },
          "sparklineConfig": { "enabled": true },
          "layout": { "x": 0, "y": 0, "w": 12, "h": 9 }
        },
        {
          "title": "p95 execution time",
          "graphStyle": "number",
          "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| group v=p95(elapsedTimeMs)\n| columns v\n| limit 1",
          "options": { "format": "auto", "precision": "0", "suffix": " ms" },
          "sparklineConfig": { "enabled": true },
          "layout": { "x": 12, "y": 0, "w": 12, "h": 9 }
        },
        {
          "title": "Error rate",
          "graphStyle": "gauge",
          "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| group errs=count(outcome=='ERROR'), n=count()\n| let v = n>0 ? errs*100.0/n : 0\n| columns v\n| limit 1",
          "colorRangeConfig": {
            "ranges": [
              { "color": "#1CAA5D", "range": { "min": 0, "max": 2 } },
              { "color": "#E6752D", "range": { "min": 2, "max": 5 } },
              { "color": "#E0483C", "range": { "min": 5, "max": 100 } }
            ]
          },
          "layout": { "x": 24, "y": 0, "w": 12, "h": 9 }
        },
        {
          "title": "Bytes scanned",
          "graphStyle": "number",
          "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| group v=sum(coverBytes)\n| columns v\n| limit 1",
          "options": { "format": "bytes", "precision": "1" },
          "layout": { "x": 36, "y": 0, "w": 12, "h": 9 }
        },
        {
          "title": "Bytes per matched event",
          "graphStyle": "number",
          "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| group b=sum(coverBytes), m=sum(matchCount)\n| let v = m>0 ? b/m : b\n| columns v\n| limit 1",
          "options": { "format": "bytes", "precision": "1" },
          "layout": { "x": 48, "y": 0, "w": 12, "h": 9 }
        },
        {
          "title": "Execution time over time (ms)",
          "graphStyle": "line",
          "lineSmoothing": "straightLines",
          "yScale": "linear",
          "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| group p50_ms=p50(elapsedTimeMs), p95_ms=p95(elapsedTimeMs), max_ms=max(elapsedTimeMs) by timestamp=timebucket()\n| sort +timestamp",
          "layout": { "x": 0, "y": 9, "w": 30, "h": 18 }
        },
        {
          "title": "Bytes scanned over time",
          "graphStyle": "line",
          "lineSmoothing": "straightLines",
          "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| group bytes_scanned=sum(coverBytes) by timestamp=timebucket()\n| sort +timestamp",
          "layout": { "x": 30, "y": 9, "w": 30, "h": 18 }
        }
      ]
    },

    {
      "tabName": "Query Anatomy & Optimization",
      "parameters": [
        {
          "name": "pq_id",
          "label": "PowerQuery ID (lrqToken) or text marker",
          "defaultValue": ""
        },
        {
          "name": "purpose",
          "label": "Query origin (queryPurpose)",
          "facet": "queryPurpose",
          "defaultValue": "*"
        }
      ],
      "graphs": [
        {
          "title": "What's on this tab",
          "graphStyle": "markdown",
          "markdown": "This tab looks past *how long* a query took and asks *what it's made of* and *how efficiently it read data*. **Query anatomy** classifies each matched execution by which constructs its text uses (an execution can use more than one, so slices add up to more than 100%). **Selectivity tiers** buckets executions by bytes scanned per matched event — the fewer bytes read per event returned, the better. **Bytes scanned — origin × time** is a heatmap: hot cells are the origin/time-window combinations doing the most expensive reading. Per-token heatmaps aren't used here on purpose — `lrqToken` values are opaque UUIDs that make unreadable row labels; the **Worst selectivity** table below gives the per-execution ranking instead, with a bar for quick comparison.",
          "layout": { "x": 0, "y": 0, "w": 60, "h": 10 }
        },
        {
          "title": "Query anatomy — share of executions using each construct",
          "graphStyle": "donut",
          "maxPieSlices": 10,
          "dataLabelType": "PERCENTAGE",
          "totalNumberConfig": { "enabled": true },
          "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| group q=newest(filter) by lrqToken\n| let idx = array(0,1,2,3,4,5).expand()\n| let construct = idx==0 ? (q contains '| group' ? 'Grouping' : '') : idx==1 ? ((q contains:anycase ' not ' || q contains '!(' || q contains '!=') ? 'Exclusion' : '') : idx==2 ? (q contains '| sort' ? 'Sorting' : '') : idx==3 ? (q contains '| limit' ? 'Limiting' : '') : idx==4 ? (q contains '| let' ? 'Transform' : '') : ((q contains '| transpose' || q contains '| join') ? 'Reshape / Join' : '')\n| filter construct != ''\n| group count=estimate_distinct(lrqToken) by construct\n| sort -count",
          "layout": { "x": 0, "y": 10, "w": 20, "h": 18 }
        },
        {
          "title": "Selectivity tiers — share of executions by efficiency",
          "graphStyle": "donut",
          "maxPieSlices": 10,
          "dataLabelType": "PERCENTAGE",
          "totalNumberConfig": { "enabled": true },
          "query": "tag='queryOutcome' coverBytes>0 (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| group bytes=sum(coverBytes), matched=sum(matchCount) by lrqToken\n| let bpm = matched>0 ? bytes/matched : bytes\n| let tier = bpm < 1000 ? '1. Good (<1KB/event)' : bpm < 100000 ? '2. Fair (<100KB/event)' : '3. Poor (>=100KB/event)'\n| group count=estimate_distinct(lrqToken) by tier\n| sort tier",
          "layout": { "x": 20, "y": 10, "w": 20, "h": 18 }
        },
        {
          "title": "Bytes scanned by origin",
          "graphStyle": "stacked_bar",
          "xAxis": "grouped_data",
          "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| group bytes_scanned=sum(coverBytes) by queryPurpose\n| filter bytes_scanned > 0\n| sort -bytes_scanned\n| columns queryPurpose, bytes_scanned",
          "layout": { "x": 40, "y": 10, "w": 20, "h": 18 }
        },
        {
          "title": "Bytes scanned — origin × time",
          "graphStyle": "heatmap",
          "query": "tag='queryOutcome' coverBytes>0 (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| group bytes=sum(coverBytes) by origin=queryPurpose, timestamp=timebucket()\n| filter bytes > 0\n| transpose origin on timestamp",
          "colorScheme": "red",
          "colorSchemeOrder": "standard",
          "numberOfRanges": 5,
          "rangesCreation": "automatic",
          "heatmapRangeConfig": ["-∞", "", "", "", "", "∞"],
          "layout": { "x": 0, "y": 28, "w": 60, "h": 20 }
        },
        {
          "title": "Worst selectivity — read a lot, returned little",
          "graphStyle": "table",
          "showBarsColumn": "true",
          "query": "tag='queryOutcome' coverBytes>0 (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| group bytes=sum(coverBytes), matched=sum(matchCount), elapsed_ms=sum(elapsedTimeMs), window_mins=newest(timeSpanMins), q=newest(filter) by lrqToken\n| let bytes_per_match = matched>0 ? bytes/matched : bytes\n| sort -bytes_per_match\n| columns lrqToken, bytes, matched, bytes_per_match, elapsed_ms, window_mins, q\n| limit 25",
          "layout": { "x": 0, "y": 48, "w": 60, "h": 20 }
        }
      ]
    },

    {
      "tabName": "Troubleshooting & Errors",
      "parameters": [
        {
          "name": "pq_id",
          "label": "PowerQuery ID (lrqToken) or text marker",
          "defaultValue": ""
        },
        {
          "name": "purpose",
          "label": "Query origin (queryPurpose)",
          "facet": "queryPurpose",
          "defaultValue": "*"
        }
      ],
      "graphs": [
        {
          "title": "What's on this tab",
          "graphStyle": "markdown",
          "markdown": "Use this tab to drill into a single query (set `pq_id` to its `lrqToken` or `//pqid:` marker) or to scan for failures across everything. **Executions** ranks every execution slowest-first. **Errors** lists only failed stages — note `outcome='ERROR'` carries no error message, so the query text in `q`/`filter` is the lead. **Stage detail** shows every audited stage for whatever `pq_id` currently selects, newest first.",
          "layout": { "x": 0, "y": 0, "w": 60, "h": 8 }
        },
        {
          "title": "Executions — one row per lrqToken, slowest first",
          "graphStyle": "table",
          "showBarsColumn": "true",
          "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| group timestamp=max(timestamp), origin=newest(queryPurpose), user=newest(userEmail), stages=count(), elapsed_ms=sum(elapsedTimeMs), cpu_ms=sum(cpuUsageMs), bytes=sum(coverBytes), matched=sum(matchCount), errors=count(outcome=='ERROR'), window_mins=newest(timeSpanMins), q=newest(filter) by lrqToken\n| let bytes_per_match = matched>0 ? bytes/matched : bytes\n| sort -elapsed_ms\n| columns timestamp, lrqToken, origin, user, stages, elapsed_ms, cpu_ms, bytes, matched, bytes_per_match, window_mins, errors, q\n| limit 100",
          "layout": { "x": 0, "y": 8, "w": 60, "h": 22 }
        },
        {
          "title": "Errors",
          "graphStyle": "table",
          "query": "tag='queryOutcome' outcome=='ERROR' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| columns timestamp, lrqToken, queryPurpose, userEmail, elapsedTimeMs, timeSpanMins, filter\n| sort -timestamp\n| limit 50",
          "layout": { "x": 0, "y": 30, "w": 30, "h": 18 }
        },
        {
          "title": "Stage detail — every audited stage of the selected execution",
          "graphStyle": "table",
          "query": "tag='queryOutcome' (lrqToken=='#pq_id#' || filter contains '#pq_id#') queryPurpose=#purpose#\n| columns timestamp, lrqToken, queryPurpose, elapsedTimeMs, cpuUsageMs, coverBytes, matchCount, outcome, timeSpanMins, filter\n| sort -timestamp\n| limit 200",
          "layout": { "x": 30, "y": 30, "w": 30, "h": 18 }
        }
      ]
    }
  ],

  "options": { "layout": { "locked": 0 } }
}
