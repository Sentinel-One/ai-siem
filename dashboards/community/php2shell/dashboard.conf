          "markdown": "Source: `dataSource.name='LogCollection'`, `dataset='accesslog'` (Apache combined format, collected from the web host by the EDR agent log collection rule). Fields: `ip`, `method`, `uriPath`, `uriQ`, `status`, `bytes`, `agent`, `referrer`, `protocol`.\n\n**Set the time range to 7 days** (exploitation attempts were reported from 2026-10-17).\n\n**What access logs can and cannot show.** They record the request line, status, size and user agent. They do **not** record form fields or bodies, so the PHP2Shell multipart fields (`PHP_SESSION_UPLOAD_PROGRESS`, the `t[]` heap spray) are invisible. These panels look for the side effects: POSTs to `.php` that fail with 5xx, bursts from one IP, a POST followed by a request to a rarely-seen `.php` file, and general probing. A successful exploit can look like a normal POST, so read this tab together with the **Error log** tab and the **Post-exploitation hunt** tab.\n\n**Behind a proxy or load balancer** every `ip` is the proxy. Log `X-Forwarded-For` or these per-IP panels lose their value. All times are UTC. Every signal here is a hypothesis until validated against real exploitation traffic.",
