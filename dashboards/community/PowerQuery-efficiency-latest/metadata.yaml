metadata_details:
  data_dependencies: "SDL query-audit telemetry in All Data: tag='queryOutcome' (emitted by the data lake itself, no connector or parser required)"
  required_fields: "tag, lrqToken, filter, queryPurpose, userEmail, elapsedTimeMs, cpuUsageMs, coverBytes, matchCount, outcome, success, timeSpanMins"
  description: "Monitors the efficiency of PowerQueries across three tabs: Overview (headline KPIs incl. an error-rate gauge), Query Anatomy & Optimization (construct breakdown, selectivity tiers, origin x time heatmap), and Troubleshooting & Errors (per-execution and per-stage drill-down). Takes a PowerQuery identifier as input (an lrqToken for one execution, or a marker comment / text substring to track the same query across runs)."
  usecase_type: "Operational"
  usecase_action: "Dashboard"
  tags: dashboard, powerquery, performance, audit, self-monitoring, gauge, heatmap, tabbed
  version: latest
  author: Marco Rottigni
