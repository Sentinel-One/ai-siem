{
  // specify a time zone if the timestamps in your log are not in GMT
  // timezone: "GMT-0800"
  
  attributes: {
    "dataSource.name": "Cloudflare",
    "dataSource.category": "security",
    "dataSource.vendor": "Cloudflare",
  }

  formats: [
    {
      id: "cloudflare",
      format: "${parse=json}$",
      repeat: true,
      rewrites: [
        {
          input:   "EdgeStartTimestamp",
          output:  "timestamp",
          match:   "(.*)",
          replace: "$1"
        }
      ]
    },
  ]
}
