          "title": "Use 7 days; verify each hit",
          "graphStyle": "markdown",
          "markdown": "**Use 7 days** for this one, same as the table above.\n\nFlags PHP whose **install path names a branch of 8.1 or older** (5.x, 7.x, 8.0, 8.1). Those branches get **no official PHP2Shell fix**: the only remediation is upgrading. If the same host is in the internet-exposure table, take it off the internet until it is upgraded.\n\n**Inferred, not measured.** EDR does not record the PHP version. Paths with no version in them (`C:\\PHP\\php.exe`, `/usr/bin/php`) are invisible here, and so is Apache mod_php (it shows as httpd). Use Application Inventory for those, and confirm every hit with `php -v`.",
